<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Application</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fb;
    font-family:Arial, Helvetica, sans-serif;
    padding:20px;
}

.card{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.card h1{
    text-align:center;
    font-size:28px;
    margin-bottom:8px;
    color:#111827;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:28px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#374151;
}

.form-group input{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

.form-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#message{
    margin-top:18px;
    text-align:center;
    font-size:14px;
    font-weight:600;
}

.success{
    color:#16a34a;
}

.error{
    color:#dc2626;
}

</style>
</head>

<body>

<div class="card">

    <h1>Student Application</h1>

    <p class="subtitle">
        Enter your details below
    </p>

    <form id="applicationForm">

        <div class="form-group">
            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="form-group">
            <label>Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10 digit mobile number"
                maxlength="10"
                required
            >
        </div>

        <div class="form-group">
            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <button
            type="submit"
            id="submitBtn"
        >
            Submit Application
        </button>

        <div id="message"></div>

    </form>

</div>


<script>

/* =========================================
   PUT YOUR SUPABASE DETAILS HERE
========================================= */

const SUPABASE_URL =
"https://kowiqnihiwgdrqohupvn.supabase.co/";

const SUPABASE_ANON_KEY =
"sb_publishable_--JHmhwO4pYOHSTd4gz9vw_CttVv1eg";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================
   FORM
========================================= */

const form =
document.getElementById("applicationForm");

const submitBtn =
document.getElementById("submitBtn");

const message =
document.getElementById("message");


form.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    const name =
    document.getElementById("name")
    .value
    .trim();


    const mobile =
    document.getElementById("mobile")
    .value
    .trim();


    const email =
    document.getElementById("email")
    .value
    .trim();


    if(!name || !mobile || !email){

        showMessage(
            "Please fill all fields.",
            "error"
        );

        return;
    }


    if(!/^[0-9]{10}$/.test(mobile)){

        showMessage(
            "Enter a valid 10 digit mobile number.",
            "error"
        );

        return;
    }


    submitBtn.disabled = true;

    submitBtn.textContent =
    "Submitting...";


    try{


        /* =========================
           SAVE TO SUPABASE
        ========================= */

        const {
            data,
            error
        } =
        await supabaseClient

        .from("applications")

        .insert({

            name:name,

            mobile:mobile,

            email:email

        })

        .select();


        if(error){

            throw error;

        }


        console.log(
            "Saved:",
            data
        );


        /* =========================
           SEND EMAIL
        ========================= */

        const {
            data:emailData,
            error:emailError
        } =
        await supabaseClient
        .functions
        .invoke(
            "send-application-email",
            {

                body:{

                    name:name,

                    email:email

                }

            }
        );


        if(emailError){

            throw emailError;

        }


        console.log(
            "Email result:",
            emailData
        );


        showMessage(
            "Application submitted successfully. Confirmation email sent.",
            "success"
        );


        form.reset();


    }
    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Something went wrong.",
            "error"
        );

    }
    finally{

        submitBtn.disabled = false;

        submitBtn.textContent =
        "Submit Application";

    }

});


function showMessage(text,type){

    message.textContent = text;

    message.className = type;

}

</script>

</body>
</html>
