<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Raksha Bandhan Banner</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

html,
body{

    width:100%;
    min-height:100%;

}

body{

    margin:0;
    padding:0;

    background:#f5f5f5;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x:hidden;

}


/* =====================================================
   BANNER WRAPPER
===================================================== */

.rakhi-banner-wrap{

    width:100%;

    margin:0;
    padding:0;

}


/* =====================================================
   MAIN BANNER
===================================================== */

.rakhi-banner{

    width:100%;

    height:180px;

    position:relative;

    overflow:hidden;

    margin:0;
    padding:0;

    border-radius:0;

    background:#ffd567;

    box-shadow:none;

    isolation:isolate;

}


/* =====================================================
   MAIN IMAGE
===================================================== */

.banner-image{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    object-position:center;

    transform:scale(1.02);

    z-index:1;

    animation:
        bannerBreath
        7s
        ease-in-out
        infinite;

}


/* =====================================================
   IMAGE BREATHING ANIMATION
===================================================== */

@keyframes bannerBreath{

    0%{

        transform:scale(1.02);

    }

    50%{

        transform:scale(1.045);

    }

    100%{

        transform:scale(1.02);

    }

}


/* =====================================================
   SOFT LIGHT SWEEP
===================================================== */

.light-sweep{

    position:absolute;

    top:-30%;

    left:-45%;

    width:35%;

    height:170%;

    transform:rotate(18deg);

    background:

        linear-gradient(

            90deg,

            transparent,

            rgba(255,255,255,.25),

            transparent

        );

    filter:blur(6px);

    pointer-events:none;

    z-index:8;

    animation:

        lightSweep

        7s

        ease-in-out

        infinite;

}


@keyframes lightSweep{

    0%{

        left:-45%;

        opacity:0;

    }

    20%{

        opacity:.5;

    }

    55%{

        opacity:.28;

    }

    100%{

        left:120%;

        opacity:0;

    }

}


/* =====================================================
   GOLDEN GLOW
===================================================== */

.glow{

    position:absolute;

    width:110px;

    height:110px;

    border-radius:50%;

    background:

        rgba(
            255,
            216,
            87,
            .30
        );

    filter:blur(26px);

    pointer-events:none;

    z-index:3;

}


.glow-one{

    left:5%;

    top:20%;

    animation:

        glowMoveOne

        4s

        ease-in-out

        infinite

        alternate;

}


.glow-two{

    right:12%;

    bottom:-20px;

    animation:

        glowMoveTwo

        5s

        ease-in-out

        infinite

        alternate;

}


/* =====================================================
   GLOW ANIMATION 1
===================================================== */

@keyframes glowMoveOne{

    from{

        transform:
            translate(0,0)
            scale(.9);

        opacity:.35;

    }

    to{

        transform:
            translate(18px,-8px)
            scale(1.25);

        opacity:.75;

    }

}


/* =====================================================
   GLOW ANIMATION 2
===================================================== */

@keyframes glowMoveTwo{

    from{

        transform:
            translate(0,0)
            scale(.9);

    }

    to{

        transform:
            translate(-20px,-10px)
            scale(1.2);

    }

}


/* =====================================================
   SPARKLES
===================================================== */

.sparkle{

    position:absolute;

    width:5px;

    height:5px;

    background:#fff4b3;

    border-radius:50%;

    box-shadow:

        0 0 5px #fff,

        0 0 10px #ffd95f,

        0 0 15px #ffd95f;

    pointer-events:none;

    z-index:9;

    animation:

        sparkleBlink

        2s

        ease-in-out

        infinite;

}


/* sparkle positions */

.sparkle.s1{

    left:16%;

    top:20%;

}


.sparkle.s2{

    left:46%;

    top:16%;

    animation-delay:.5s;

}


.sparkle.s3{

    right:17%;

    top:20%;

    animation-delay:1s;

}


.sparkle.s4{

    left:34%;

    bottom:20%;

    animation-delay:1.4s;

}


.sparkle.s5{

    right:35%;

    bottom:14%;

    animation-delay:1.8s;

}


/* =====================================================
   SPARKLE ANIMATION
===================================================== */

@keyframes sparkleBlink{

    0%,
    100%{

        opacity:.15;

        transform:scale(.5);

    }

    50%{

        opacity:1;

        transform:scale(1.7);

    }

}


/* =====================================================
   FALLING PETALS
===================================================== */

.petal{

    position:absolute;

    width:9px;

    height:15px;

    background:

        linear-gradient(

            135deg,

            #ff476c,

            #d91d48

        );

    border-radius:

        90% 0 90% 0;

    opacity:.75;

    pointer-events:none;

    z-index:7;

    animation:

        petalFall

        6s

        linear

        infinite;

}


/* petal positions */

.petal.p1{

    left:20%;

    top:-25px;

}


.petal.p2{

    left:42%;

    top:-40px;

    animation-delay:1.8s;

}


.petal.p3{

    left:65%;

    top:-20px;

    animation-delay:3.2s;

}


.petal.p4{

    left:82%;

    top:-50px;

    animation-delay:4.3s;

}


/* =====================================================
   PETAL ANIMATION
===================================================== */

@keyframes petalFall{

    0%{

        transform:

            translateY(-20px)

            translateX(0)

            rotate(0deg);

        opacity:0;

    }

    15%{

        opacity:.75;

    }

    50%{

        transform:

            translateY(100px)

            translateX(18px)

            rotate(160deg);

    }

    100%{

        transform:

            translateY(220px)

            translateX(-15px)

            rotate(360deg);

        opacity:0;

    }

}


/* =====================================================
   BOTTOM GOLDEN SHINE
===================================================== */

.bottom-glow{

    position:absolute;

    width:50%;

    height:40px;

    bottom:-24px;

    left:25%;

    background:

        rgba(
            255,
            218,
            91,
            .38
        );

    filter:blur(18px);

    pointer-events:none;

    z-index:4;

    animation:

        bottomGlow

        3s

        ease-in-out

        infinite

        alternate;

}


/* =====================================================
   BOTTOM GLOW ANIMATION
===================================================== */

@keyframes bottomGlow{

    from{

        opacity:.25;

        transform:scaleX(.85);

    }

    to{

        opacity:.8;

        transform:scaleX(1.15);

    }

}


/* =====================================================
   TAP ANIMATION
===================================================== */

.rakhi-banner.tap{

    animation:

        bannerTap

        .35s

        ease;

}


@keyframes bannerTap{

    0%{

        transform:scale(1);

    }

    50%{

        transform:scale(.985);

    }

    100%{

        transform:scale(1);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

    html,
    body{

        width:100%;

        margin:0;

        padding:0;

    }


    body{

        overflow-x:hidden;

    }


    .rakhi-banner-wrap{

        width:100%;

        margin:0;

        padding:0;

    }


    .rakhi-banner{

        width:100%;

        height:175px;

        margin:0;

        padding:0;

        border-radius:0;

        box-shadow:none;

    }


    .banner-image{

        position:absolute;

        left:0;

        top:0;

        width:100%;

        height:100%;

        object-fit:cover;

        object-position:center;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .rakhi-banner{

        width:100%;

        height:165px;

        border-radius:0;

    }


    .banner-image{

        width:100%;

        height:100%;

        object-fit:cover;

        object-position:center;

    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:330px){

    .rakhi-banner{

        height:155px;

    }

}


/* =====================================================
   TABLET
===================================================== */

@media(min-width:700px){

    .rakhi-banner-wrap{

        width:100%;

        margin:0;

        padding:0;

    }


    .rakhi-banner{

        width:100%;

        height:260px;

        border-radius:0;

        box-shadow:none;

    }

}


/* =====================================================
   LARGE DESKTOP
===================================================== */

@media(min-width:1200px){

    .rakhi-banner{

        height:300px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     RAKSHA BANDHAN BANNER
===================================================== -->

<div class="rakhi-banner-wrap">


    <div
        class="rakhi-banner"
        id="rakhiBanner"
    >


        <!-- MAIN IMAGE -->

        <img

            src="rakhii222.png"

            class="banner-image"

            alt="Happy Raksha Bandhan"

        >


        <!-- MOVING LIGHT -->

        <div class="light-sweep"></div>


        <!-- GOLDEN GLOWS -->

        <div class="glow glow-one"></div>

        <div class="glow glow-two"></div>


        <!-- SPARKLES -->

        <span class="sparkle s1"></span>

        <span class="sparkle s2"></span>

        <span class="sparkle s3"></span>

        <span class="sparkle s4"></span>

        <span class="sparkle s5"></span>


        <!-- PETALS -->

        <span class="petal p1"></span>

        <span class="petal p2"></span>

        <span class="petal p3"></span>

        <span class="petal p4"></span>


        <!-- BOTTOM GLOW -->

        <div class="bottom-glow"></div>


    </div>

</div>


<script>

/* =====================================================
   BANNER TAP
===================================================== */

const banner =
    document.getElementById(
        "rakhiBanner"
    );


banner.addEventListener(
    "click",
    function(){

        banner.classList.remove(
            "tap"
        );

        void banner.offsetWidth;

        banner.classList.add(
            "tap"
        );

    }
);


/* =====================================================
   RANDOM SPARKLE CREATOR
===================================================== */

function createSpark(){

    const spark =
        document.createElement(
            "span"
        );


    spark.className =
        "sparkle";


    spark.style.left =
        Math.random() * 92 + "%";


    spark.style.top =
        Math.random() * 82 + "%";


    spark.style.animationDuration =
        (
            1.4 +
            Math.random() * 1.8
        ) + "s";


    banner.appendChild(
        spark
    );


    setTimeout(
        function(){

            spark.remove();

        },
        2500
    );

}


/* =====================================================
   CREATE EXTRA SPARKLES
===================================================== */

setInterval(
    function(){

        createSpark();

    },
    1100
);

</script>


</body>

</html>
