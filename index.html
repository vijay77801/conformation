<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rakhi Celebration</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Manrope',sans-serif;
    background:#fff4eb;
}

button{
    font:inherit;
}


/* =====================================================
   MAIN APP
===================================================== */

.rakhi-app{
    width:100%;
    height:100vh;
    height:100svh;

    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            160deg,
            #fffaf6 0%,
            #fff1e5 48%,
            #fff8f3 100%
        );
}


/* =====================================================
   COMMON SCREEN
===================================================== */

.rakhi-screen{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:
        linear-gradient(
            160deg,
            #fffaf6 0%,
            #fff1e5 48%,
            #fff8f3 100%
        );
}


/* =====================================================
   HOME SCREEN
===================================================== */

.rakhi-home{
    z-index:1;

    display:flex;
    flex-direction:column;

    transform:translateX(0);

    transition:
        transform .42s
        cubic-bezier(.22,.8,.25,1);
}

.rakhi-app.page-open .rakhi-home{
    transform:translateX(-25%);
}


/* =====================================================
   TOP AREA
===================================================== */

.rakhi-top,
.code-rakhi-top{
    width:100%;

    height:44vh;
    min-height:310px;
    max-height:410px;

    position:relative;

    flex-shrink:0;
}


/* =====================================================
   TOP HANGINGS
===================================================== */

.rakhi-hanging{
    position:absolute;

    top:0;

    width:82px;
    height:95px;

    z-index:4;

    pointer-events:none;
}

.rakhi-hanging.left{
    left:0;
}

.rakhi-hanging.right{
    right:0;
    transform:scaleX(-1);
}

.hanging-thread{
    position:absolute;

    top:0;

    width:1px;

    background:rgba(75,60,50,.18);
}

.thread-one{
    left:10px;
    height:34px;
}

.thread-two{
    left:39px;
    height:57px;
}

.thread-three{
    left:70px;
    height:27px;
}

.hanging-thread::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-9px;

    width:15px;
    height:15px;

    transform:
        translateX(-50%)
        rotate(45deg);

    border:1px solid rgba(80,60,50,.18);

    background:rgba(255,255,255,.82);

    border-radius:4px;
}

.hanging-thread::before{
    content:"";

    position:absolute;

    left:50%;
    bottom:-20px;

    width:4px;
    height:4px;

    transform:translateX(-50%);

    border-radius:50%;

    background:rgba(80,60,50,.22);
}


/* =====================================================
   ANIMATED IMAGES
===================================================== */

.rakhi-images,
.code-rakhi-images{
    position:absolute;

    left:50%;
    bottom:55px;

    transform:translateX(-50%);

    width:min(77vw,330px);
    height:72%;

    z-index:5;
}

.rakhi-images img,
.code-rakhi-images img{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:100%;

    object-fit:contain;
    object-position:center bottom;

    transition:none !important;
    animation:none !important;
}

.rakhi-image-two,
.code-rakhi-image-two{
    display:none;
}


/* =====================================================
   CURVED LINE
===================================================== */

.rakhi-curve,
.code-rakhi-curve{
    position:absolute;

    left:-8%;
    bottom:-39px;

    width:116%;
    height:120px;

    border-bottom:
        1.5px solid
        rgba(95,70,55,.18);

    border-radius:
        0 0 50% 50%;

    z-index:3;

    pointer-events:none;
}

.rakhi-curve::after,
.code-rakhi-curve::after{
    content:"";

    position:absolute;

    left:8%;
    bottom:8px;

    width:84%;
    height:95px;

    border-bottom:
        1px solid
        rgba(95,70,55,.055);

    border-radius:
        0 0 50% 50%;
}


/* =====================================================
   HOME CONTENT
===================================================== */

.rakhi-content{
    width:100%;

    flex:1;

    display:flex;
    flex-direction:column;

    padding:
        52px
        18px
        0;
}


/* =====================================================
   HOME MESSAGE
===================================================== */

.rakhi-message{
    width:100%;

    text-align:center;

    padding:
        5px
        15px
        22px;
}

.rakhi-message-small{
    font-size:8px;

    font-weight:600;

    letter-spacing:2.2px;

    color:#9b8e86;

    margin-bottom:8px;
}

.rakhi-message h1{
    font-family:'DM Serif Display',serif;

    font-size:
        clamp(24px,6.4vw,30px);

    line-height:1.05;

    font-weight:400;

    color:#292522;
}

.rakhi-message p{
    margin:10px auto 0;

    max-width:245px;

    font-size:9px;

    line-height:1.6;

    color:#847a75;
}


/* =====================================================
   BRO + SIS CARDS
===================================================== */

.rakhi-person-cards{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;

    position:relative;

    z-index:5;
}

.rakhi-person-card{
    width:100%;
    height:155px;

    position:relative;

    padding:
        19px
        16px;

    overflow:hidden;

    border-radius:22px;

    border:
        1px solid
        rgba(95,70,55,.075);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.90),
            rgba(255,255,255,.55)
        );

    box-shadow:
        0 10px 30px
        rgba(83,58,40,.045);

    text-align:left;

    cursor:pointer;

    color:inherit;

    -webkit-tap-highlight-color:transparent;
}

.rakhi-person-card:active{
    transform:scale(.98);
}

.rakhi-person-card::after{
    content:"";

    position:absolute;

    right:-32px;
    bottom:-35px;

    width:100px;
    height:100px;

    border-radius:50%;

    background:rgba(232,195,169,.11);
}

.rakhi-person-card::before{
    content:"";

    position:absolute;

    right:18px;
    bottom:18px;

    width:37px;
    height:37px;

    border-radius:50%;

    border:
        1px solid
        rgba(120,90,70,.075);
}

.person-small{
    position:relative;

    z-index:2;

    font-size:7px;

    font-weight:600;

    letter-spacing:1.7px;

    color:#a09994;

    margin-bottom:9px;
}

.person-name{
    position:relative;

    z-index:2;

    font-family:'DM Serif Display',serif;

    font-size:31px;

    line-height:1;

    font-weight:400;

    color:#292624;
}

.person-text{
    position:relative;

    z-index:2;

    margin-top:12px;

    max-width:115px;

    font-size:8.5px;

    line-height:1.55;

    color:#8a837e;
}


/* =====================================================
   HOME BOTTOM DECORATION
===================================================== */

.celebration-bottom{
    width:100%;

    flex:1;

    min-height:125px;

    position:relative;

    overflow:hidden;

    margin-top:8px;
}


/* =====================================================
   CENTER CURVED LIGHTS
===================================================== */

.bottom-lights{
    position:absolute;

    left:50%;
    top:22px;

    transform:translateX(-50%);

    width:48%;
    height:62px;

    border-top:
        1px solid
        rgba(105,80,65,.14);

    border-radius:50%;

    z-index:3;
}

.light-string{
    position:absolute;

    top:-1px;

    width:1px;

    background:
        rgba(95,75,60,.15);
}

.light-string::after{
    content:"";

    position:absolute;

    left:50%;
    bottom:-6px;

    transform:translateX(-50%);

    width:8px;
    height:10px;

    border-radius:
        50% 50% 45% 45%;

    background:
        rgba(244,199,124,.68);

    border:
        1px solid
        rgba(170,125,75,.08);

    box-shadow:
        0 0 9px
        rgba(244,199,124,.20);
}

.light-1{
    left:4%;
    height:10px;
}

.light-2{
    left:27%;
    height:22px;
}

.light-3{
    left:50%;
    height:31px;
}

.light-4{
    left:73%;
    height:22px;
}

.light-5{
    left:96%;
    height:10px;
}


/* =====================================================
   SMALL DECORATIVE DOTS
===================================================== */

.bottom-dot{
    position:absolute;

    border-radius:50%;

    background:
        rgba(211,165,138,.22);

    z-index:2;
}

.dot-one{
    width:5px;
    height:5px;

    left:31%;
    top:75px;
}

.dot-two{
    width:3px;
    height:3px;

    left:40%;
    top:92px;

    background:
        rgba(218,181,120,.28);
}

.dot-three{
    width:4px;
    height:4px;

    right:36%;
    top:87px;
}

.dot-four{
    width:3px;
    height:3px;

    right:27%;
    top:68px;

    background:
        rgba(218,181,120,.28);
}


/* =====================================================
   BALLOONS
===================================================== */

.balloon-group{
    position:absolute;

    bottom:-24px;

    width:110px;
    height:135px;

    z-index:1;
}

.balloon-left{
    left:-28px;
}

.balloon-right{
    right:-28px;

    transform:scaleX(-1);
}

.balloon{
    position:absolute;

    border-radius:
        52% 52%
        48% 48%;

    border:
        1px solid
        rgba(90,65,50,.07);
}

.balloon::after{
    content:"";

    position:absolute;

    left:50%;
    top:100%;

    width:1px;
    height:62px;

    background:
        rgba(90,70,60,.11);
}

.balloon::before{
    content:"";

    position:absolute;

    left:50%;
    bottom:-4px;

    width:6px;
    height:6px;

    transform:
        translateX(-50%)
        rotate(45deg);

    background:inherit;
}

.balloon-one,
.balloon-four{
    width:43px;
    height:55px;

    left:3px;
    top:31px;

    background:
        rgba(238,181,154,.33);

    transform:rotate(-8deg);
}

.balloon-two,
.balloon-five{
    width:38px;
    height:49px;

    left:45px;
    top:3px;

    background:
        rgba(246,207,145,.38);

    transform:rotate(5deg);
}

.balloon-three,
.balloon-six{
    width:31px;
    height:41px;

    left:78px;
    top:48px;

    background:
        rgba(218,181,172,.29);

    transform:rotate(9deg);
}


/* =====================================================
   SECOND PAGE
===================================================== */

.rakhi-code-page{
    z-index:20;

    display:flex;
    flex-direction:column;

    transform:translateX(100%);

    transition:
        transform .42s
        cubic-bezier(.22,.8,.25,1);

    background:
        linear-gradient(
            160deg,
            #fffaf6 0%,
            #fff1e5 48%,
            #fff8f3 100%
        );

    box-shadow:
        -15px 0 45px
        rgba(74,48,32,.08);
}

.rakhi-app.page-open .rakhi-code-page{
    transform:translateX(0);
}


/* =====================================================
   SECOND PAGE BACK BUTTON
===================================================== */

.code-back{
    position:absolute;

    left:17px;

    top:
        calc(
            15px +
            env(safe-area-inset-top)
        );

    width:41px;
    height:41px;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:20;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.76);

    border:
        1px solid
        rgba(90,70,55,.08);

    box-shadow:
        0 5px 18px
        rgba(70,50,35,.05);

    color:#302a27;

    font-size:25px;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   SECOND PAGE CONTENT
===================================================== */

.code-content{
    width:100%;

    flex:1;

    display:flex;
    flex-direction:column;

    align-items:center;

    padding:
        52px
        20px
        25px;

    text-align:center;
}

.code-small-heading{
    font-size:8px;

    font-weight:600;

    letter-spacing:2.2px;

    color:#9b8e86;

    margin-bottom:9px;
}

.code-title{
    font-family:'DM Serif Display',serif;

    font-size:
        clamp(25px,7vw,31px);

    line-height:1.05;

    font-weight:400;

    color:#292522;

    max-width:300px;
}

.code-description{
    margin-top:11px;

    max-width:270px;

    font-size:10px;

    line-height:1.55;

    color:#847a75;
}


/* =====================================================
   GENERATED CODE CARD
===================================================== */

.generated-code-box{
    width:100%;

    max-width:350px;

    margin-top:26px;

    padding:
        21px
        17px;

    border-radius:21px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.88),
            rgba(255,255,255,.56)
        );

    border:
        1px solid
        rgba(95,70,55,.08);

    box-shadow:
        0 10px 30px
        rgba(83,58,40,.04);
}

.generated-code-label{
    font-size:7px;

    font-weight:600;

    letter-spacing:1.8px;

    color:#a09690;

    margin-bottom:9px;
}

.generated-code{
    font-size:
        clamp(19px,5.5vw,23px);

    font-weight:700;

    letter-spacing:2px;

    color:#302a27;
}


/* =====================================================
   COPY BUTTON
===================================================== */

.copy-code-btn{
    width:100%;

    max-width:350px;

    height:48px;

    margin-top:13px;

    border:0;

    border-radius:16px;

    background:#302a27;

    color:#ffffff;

    font-size:11px;

    font-weight:600;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.copy-code-btn:active{
    transform:scale(.985);
}

.copy-status{
    height:20px;

    margin-top:8px;

    font-size:9px;

    color:#847a75;
}


/* =====================================================
   SECOND PAGE BOTTOM
===================================================== */

.code-page-bottom{
    width:100%;

    flex:1;

    min-height:70px;

    position:relative;

    overflow:hidden;
}

.code-page-bottom::before{
    content:"";

    position:absolute;

    left:-10%;
    bottom:-75px;

    width:120%;
    height:120px;

    border-top:
        1px solid
        rgba(95,70,55,.08);

    border-radius:50%;
}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:360px){

    .rakhi-top,
    .code-rakhi-top{
        height:42vh;
        min-height:285px;
    }

    .rakhi-hanging{
        width:68px;
        height:80px;
    }

    .thread-one{
        left:8px;
        height:29px;
    }

    .thread-two{
        left:32px;
        height:47px;
    }

    .thread-three{
        left:58px;
        height:23px;
    }

    .hanging-thread::after{
        width:13px;
        height:13px;
    }

    .rakhi-images,
    .code-rakhi-images{
        bottom:52px;

        width:75vw;
        height:70%;
    }

    .rakhi-curve,
    .code-rakhi-curve{
        bottom:-36px;

        height:112px;
    }

    .rakhi-content{
        padding:
            45px
            13px
            0;
    }

    .code-content{
        padding:
            45px
            15px
            20px;
    }

    .rakhi-message{
        padding-bottom:18px;
    }

    .rakhi-message h1{
        font-size:22px;
    }

    .rakhi-person-cards{
        gap:10px;
    }

    .rakhi-person-card{
        height:140px;

        padding:
            16px
            13px;

        border-radius:19px;
    }

    .person-name{
        font-size:28px;
    }

    .celebration-bottom{
        min-height:110px;

        margin-top:6px;
    }

    .bottom-lights{
        width:44%;

        top:20px;
    }

    .balloon-left{
        left:-35px;

        transform:scale(.90);
    }

    .balloon-right{
        right:-35px;

        transform:
            scaleX(-1)
            scale(.90);
    }

    .code-title{
        font-size:24px;
    }

    .generated-code-box{
        margin-top:20px;

        padding:
            18px
            14px;
    }
}


/* =====================================================
   SHORT MOBILE
===================================================== */

@media(max-height:700px){

    .rakhi-top,
    .code-rakhi-top{
        height:40vh;

        min-height:270px;
    }

    .rakhi-content{
        padding-top:42px;
    }

    .code-content{
        padding-top:42px;
    }

    .rakhi-person-card{
        height:132px;
    }

    .celebration-bottom{
        min-height:90px;
    }

    .generated-code-box{
        margin-top:18px;
    }
}


/* =====================================================
   DESKTOP PREVIEW
===================================================== */

@media(min-width:480px){

    .rakhi-app{
        max-width:480px;

        margin:auto;
    }
}

</style>
</head>

<body>


<div class="rakhi-app" id="rakhiApp">


<!-- =====================================================
     PAGE 1 - HOME
===================================================== -->

<section class="rakhi-screen rakhi-home">


    <div class="rakhi-top">


        <!-- LEFT HANGINGS -->

        <div class="rakhi-hanging left">

            <span class="hanging-thread thread-one"></span>
            <span class="hanging-thread thread-two"></span>
            <span class="hanging-thread thread-three"></span>

        </div>


        <!-- RIGHT HANGINGS -->

        <div class="rakhi-hanging right">

            <span class="hanging-thread thread-one"></span>
            <span class="hanging-thread thread-two"></span>
            <span class="hanging-thread thread-three"></span>

        </div>


        <!-- HOME IMAGES -->

        <div class="rakhi-images">

            <img
                class="rakhi-image-one"
                src="image1.png"
                alt="Rakhi"
            >

            <img
                class="rakhi-image-two"
                src="image2.png"
                alt="Rakhi Celebration"
            >

        </div>


        <!-- CURVE -->

        <div class="rakhi-curve"></div>


    </div>



    <!-- HOME CONTENT -->

    <div class="rakhi-content">


        <div class="rakhi-message">

            <div class="rakhi-message-small">
                RAKSHA BANDHAN
            </div>

            <h1>
                Celebrate the bond.
            </h1>

            <p>
                Little fights, endless laughs
                and a lifetime of memories.
            </p>

        </div>



        <!-- BRO + SIS -->

        <div class="rakhi-person-cards">


            <button
                type="button"
                class="rakhi-person-card bro-card"
            >

                <div class="person-small">
                    FOR YOUR
                </div>

                <div class="person-name">
                    Bro
                </div>

                <div class="person-text">
                    Create something special
                    for your sibling.
                </div>

            </button>



            <button
                type="button"
                class="rakhi-person-card sis-card"
            >

                <div class="person-small">
                    FOR YOUR
                </div>

                <div class="person-name">
                    Sis
                </div>

                <div class="person-text">
                    Create something special
                    for your sibling.
                </div>

            </button>


        </div>



        <!-- =================================================
             BOTTOM DESIGN
        ================================================== -->

        <div class="celebration-bottom">


            <!-- LEFT BALLOONS -->

            <div class="balloon-group balloon-left">

                <span class="balloon balloon-one"></span>
                <span class="balloon balloon-two"></span>
                <span class="balloon balloon-three"></span>

            </div>



            <!-- CENTER LIGHTS -->

            <div class="bottom-lights">

                <span class="light-string light-1"></span>
                <span class="light-string light-2"></span>
                <span class="light-string light-3"></span>
                <span class="light-string light-4"></span>
                <span class="light-string light-5"></span>

            </div>



            <!-- SMALL DOTS -->

            <span class="bottom-dot dot-one"></span>
            <span class="bottom-dot dot-two"></span>
            <span class="bottom-dot dot-three"></span>
            <span class="bottom-dot dot-four"></span>



            <!-- RIGHT BALLOONS -->

            <div class="balloon-group balloon-right">

                <span class="balloon balloon-four"></span>
                <span class="balloon balloon-five"></span>
                <span class="balloon balloon-six"></span>

            </div>


        </div>


    </div>


</section>



<!-- =====================================================
     PAGE 2
     SLIDES RIGHT -> LEFT
===================================================== -->

<section class="rakhi-screen rakhi-code-page">


    <!-- BACK -->

    <button
        type="button"
        class="code-back"
        id="codeBack"
        aria-label="Back"
    >
        ‹
    </button>



    <!-- SAME TOP -->

    <div class="code-rakhi-top">


        <!-- LEFT HANGINGS -->

        <div class="rakhi-hanging left">

            <span class="hanging-thread thread-one"></span>
            <span class="hanging-thread thread-two"></span>
            <span class="hanging-thread thread-three"></span>

        </div>



        <!-- RIGHT HANGINGS -->

        <div class="rakhi-hanging right">

            <span class="hanging-thread thread-one"></span>
            <span class="hanging-thread thread-two"></span>
            <span class="hanging-thread thread-three"></span>

        </div>



        <!-- SAME ANIMATED IMAGES -->

        <div class="code-rakhi-images">

            <img
                class="code-rakhi-image-one"
                src="image1.png"
                alt="Rakhi"
            >

            <img
                class="code-rakhi-image-two"
                src="image2.png"
                alt="Rakhi Celebration"
            >

        </div>



        <!-- SAME CURVE -->

        <div class="code-rakhi-curve"></div>


    </div>



    <!-- =================================================
         SECOND PAGE MATTER
    ================================================== -->

    <div class="code-content">


        <div class="code-small-heading">
            RAKSHA BANDHAN
        </div>



        <h1
            class="code-title"
            id="codeTitle"
        >
            A little surprise for your sister.
        </h1>



        <p
            class="code-description"
            id="codeDescription"
        >
            Share this code with your sister
            and celebrate the bond together.
        </p>



        <!-- GENERATED CODE -->

        <div class="generated-code-box">


            <div class="generated-code-label">
                YOUR SHARING CODE
            </div>


            <div
                class="generated-code"
                id="generatedCode"
            >
                RAKHI-XXXXXX
            </div>


        </div>



        <!-- COPY -->

        <button
            type="button"
            class="copy-code-btn"
            id="copyCodeBtn"
        >
            Copy Code
        </button>


        <div
            class="copy-status"
            id="copyStatus"
        ></div>


        <div class="code-page-bottom"></div>


    </div>


</section>


</div>



<script>

/* =====================================================
   HOME IMAGE ANIMATION
===================================================== */

const homeImage1 =
document.querySelector(".rakhi-image-one");

const homeImage2 =
document.querySelector(".rakhi-image-two");

let homeFirst = true;


setInterval(() => {

    if(homeFirst){

        homeImage1.style.display = "none";
        homeImage2.style.display = "block";

    }else{

        homeImage1.style.display = "block";
        homeImage2.style.display = "none";

    }

    homeFirst = !homeFirst;

},1100);



/* =====================================================
   SECOND PAGE IMAGE ANIMATION
===================================================== */

const codeImage1 =
document.querySelector(".code-rakhi-image-one");

const codeImage2 =
document.querySelector(".code-rakhi-image-two");

let codeFirst = true;


setInterval(() => {

    if(codeFirst){

        codeImage1.style.display = "none";
        codeImage2.style.display = "block";

    }else{

        codeImage1.style.display = "block";
        codeImage2.style.display = "none";

    }

    codeFirst = !codeFirst;

},1100);



/* =====================================================
   ELEMENTS
===================================================== */

const rakhiApp =
document.getElementById("rakhiApp");

const broCard =
document.querySelector(".bro-card");

const sisCard =
document.querySelector(".sis-card");

const codeBack =
document.getElementById("codeBack");

const codeTitle =
document.getElementById("codeTitle");

const codeDescription =
document.getElementById("codeDescription");

const generatedCode =
document.getElementById("generatedCode");

const copyCodeBtn =
document.getElementById("copyCodeBtn");

const copyStatus =
document.getElementById("copyStatus");



/* =====================================================
   ONE DEVICE = ONE CODE

   IMPORTANT:

   First visit on Device A:
   RAKHI-ABC123

   Every repeat on Device A:
   RAKHI-ABC123

   Device B:
   RAKHI-7KP9MX

   Every repeat on Device B:
   RAKHI-7KP9MX
===================================================== */

function getDeviceRakhiCode(){


    /* CHECK SAVED CODE */

    const savedCode =
    localStorage.getItem(
        "cezooRakhiDeviceCode"
    );


    /* ALREADY EXISTS */

    if(savedCode){

        return savedCode;

    }



    /* =================================================
       FIRST TIME ON THIS DEVICE/BROWSER
    ================================================= */

    const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let randomPart = "";


    for(let i = 0; i < 6; i++){

        const randomIndex =
        Math.floor(
            Math.random() *
            characters.length
        );

        randomPart +=
        characters[randomIndex];

    }



    /* CREATE CODE */

    const newCode =
    "RAKHI-" + randomPart;



    /* =================================================
       SAVE IT

       THIS IS THE IMPORTANT PART
    ================================================= */

    localStorage.setItem(
        "cezooRakhiDeviceCode",
        newCode
    );



    return newCode;

}



/* =====================================================
   GET DEVICE CODE ONCE
===================================================== */

const deviceRakhiCode =
getDeviceRakhiCode();



/* =====================================================
   OPEN SECOND PAGE
===================================================== */

function openCodePage(type){


    /* =================================================
       ALWAYS USE SAME DEVICE CODE

       NO NEW RANDOM CODE HERE
    ================================================= */

    generatedCode.textContent =
    deviceRakhiCode;


    copyStatus.textContent = "";



    /* =================================================
       BRO CARD

       USER SHARES CODE WITH SISTER
    ================================================= */

    if(type === "bro"){

        codeTitle.textContent =
        "A little surprise for your sister.";


        codeDescription.textContent =
        "Share this code with your sister and celebrate the bond you both share.";

    }



    /* =================================================
       SIS CARD

       USER SHARES CODE WITH BROTHER
    ================================================= */

    if(type === "sis"){

        codeTitle.textContent =
        "A little surprise for your brother.";


        codeDescription.textContent =
        "Share this code with your brother and celebrate the bond you both share.";

    }



    /* SLIDE SECOND PAGE */

    rakhiApp.classList.add(
        "page-open"
    );

}



/* =====================================================
   BRO CLICK
===================================================== */

broCard.addEventListener(
    "click",
    function(){

        openCodePage("bro");

    }
);



/* =====================================================
   SIS CLICK
===================================================== */

sisCard.addEventListener(
    "click",
    function(){

        openCodePage("sis");

    }
);



/* =====================================================
   BACK
===================================================== */

codeBack.addEventListener(
    "click",
    function(){

        rakhiApp.classList.remove(
            "page-open"
        );

    }
);



/* =====================================================
   COPY CODE
===================================================== */

copyCodeBtn.addEventListener(
    "click",
    async function(){

        const code =
        generatedCode.textContent;


        try{

            await navigator.clipboard.writeText(
                code
            );


            copyStatus.textContent =
            "Code copied";

        }


        catch(error){


            const temp =
            document.createElement(
                "textarea"
            );


            temp.value = code;

            temp.style.position =
            "fixed";

            temp.style.opacity =
            "0";


            document.body.appendChild(
                temp
            );


            temp.focus();

            temp.select();


            document.execCommand(
                "copy"
            );


            temp.remove();


            copyStatus.textContent =
            "Code copied";

        }

    }
);



/* =====================================================
   ESCAPE KEY BACK
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            rakhiApp.classList.remove(
                "page-open"
            );

        }

    }
);

</script>


</body>
</html>
